<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Employee Management System</h1>

    <form id="employeeForm">

        <input
            type="text"
            id="name"
            placeholder="Employee Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email address"
            required
        >

        <input
            type="text"
            id="department"
            placeholder="Department"
            required
        >

        <button type="submit">
            Add Employee
        </button>

    </form>

    <h2>Employees</h2>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="employeeTable">

        </tbody>

    </table>

</div>

<script src="app.js"></script>

</body>

</html>
